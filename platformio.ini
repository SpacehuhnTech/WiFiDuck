[platformio]
default_envs = dstike_avr, dstike_esp8266
src_dir = .
boards_dir = boards

[env]
framework = arduino

[env:dstike_avr]
platform = atmelavr@5.3.0
board = dstike_wifiduck_avr
build_src_filter = -<*> +<atmega_duck/*.cpp> +<atmega_duck/*.c> +<pio/avr_main.cpp>

[env:dstike_esp8266]
platform = espressif8266@2.6.3
board = dstike_wifiduck_esp8266
board_build.filesystem = spiffs
build_src_filter = -<*> +<esp_duck/*.cpp> +<pio/esp8266_main.cpp>
extra_scripts = pre:tools/pio_esp8266.py
lib_deps =
    https://github.com/spacehuhntech/SimpleCLI.git#bb4d30e37a1c9a9a4e0066ef885928003285d993
    me-no-dev/ESPAsyncTCP@1.2.2
    https://github.com/me-no-dev/ESPAsyncWebServer.git#902077553f42c4980976c4053e8478f2bd5558f4
lib_compat_mode = strict
lib_ldf_mode = chain+
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

[env:dstike_esp8266_ota]
extends = env:dstike_esp8266
upload_protocol = espota
upload_port = 192.168.4.1
